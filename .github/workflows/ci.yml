name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  # อนุญาตให้กด "Re-run" ได้ตรง ๆ แม้ trigger จะเป็น pull_request เท่านั้น
  workflow_dispatch:

# ยกเลิก run เก่าของ PR เดียวกันถ้ามี push ใหม่เข้ามาทับ ประหยัดเวลา CI
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    # เทสที่ต่อ DB จริงยิงใส่ Neon branch ที่สร้างใหม่ทุก run แล้วลบทิ้ง
    # (ดูขั้นตอน "Create ephemeral Neon branch" ด้านล่าง) ไม่ใช่ service
    # container และไม่ใช่ Neon ที่ทีมแชร์กัน — เทสพวกนี้เขียนและลบข้อมูลจริง
    #
    # ต้องตั้งค่าไว้ที่ repo → Settings → Secrets and variables → Actions:
    #   secret   NEON_API_KEY        Neon Console → Account settings → API keys
    #   variable NEON_PROJECT_ID     Neon Console → Project → Settings → General
    #   variable NEON_PARENT_BRANCH  (ไม่ใส่ก็ได้ default `production`)

    # ค่า dummy สำหรับ config/settings ที่ต้องมี env ตอน import แอป
    # unit/architecture ไม่ต่อ DB จริง จึงใส่ค่าปลอมพอให้ import ผ่าน
    # ห้ามชี้ค่าพวกนี้ไปที่ Neon จริง — tests/conftest.py จะ fail ถ้า
    # POSTGRES_TEST_URL ชี้ compute เดียวกับ DATABASE_URL
    env:
      APP_ENV: test
      APP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://user:pass@localhost:5432/greader_test
      DATABASE_URL_UNPOOLED: postgresql+psycopg://user:pass@localhost:5432/greader_test
      SECRET_KEY: ci-dummy-secret-key
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ci-dummy-key
      GEMINI_MODEL: gemini-3.5-flash
      R2_ENDPOINT_URL: https://example.r2.cloudflarestorage.com
      R2_BUCKET_NAME: ci-dummy-bucket
      R2_ACCESS_KEY_ID: ci-dummy-access-key
      R2_SECRET_ACCESS_KEY: ci-dummy-secret-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # กิ่งใช้แล้วทิ้ง copy-on-write จาก parent — ได้ schema, pgvector และ
      # HNSW index มาครบโดยไม่แตะข้อมูลที่ทีมใช้อยู่ --expires-at เป็นตาข่าย
      # กันลืม เผื่อขั้นตอนลบไม่ได้รัน (runner ถูก kill กลางคัน)
      - name: Create ephemeral Neon branch
        id: neon_branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          branch="ci-${{ github.run_id }}-${{ github.run_attempt }}"
          npx -y neonctl branches create \
            --project-id "${{ vars.NEON_PROJECT_ID }}" \
            --name "$branch" \
            --parent "${{ vars.NEON_PARENT_BRANCH || 'production' }}" \
            --expires-at "$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)"
          # ตั้ง output หลังสร้างสำเร็จเท่านั้น ขั้นตอนลบจะได้ไม่ไปไล่ลบกิ่งที่ไม่เคยเกิด
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # neonctl พิมพ์ DSN มาเป็น postgresql:// เปล่า ๆ ซึ่ง SQLAlchemy จะไปหา
      # psycopg2 ที่โปรเจกต์ไม่ได้ลง แล้วล้มด้วย NoSuchModuleError จึงต้องเติม
      # +psycopg เอง เก็บไว้ใน POSTGRES_TEST_URL ตัวเดียว ไม่ทับ DATABASE_URL
      - name: Export branch connection string
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          raw="$(npx -y neonctl connection-string "${{ steps.neon_branch.outputs.branch }}" \
            --project-id "${{ vars.NEON_PROJECT_ID }}")"
          echo "::add-mask::$raw"
          dsn="$(printf '%s' "$raw" | sed -E 's#^postgresql://#postgresql+psycopg://#')"
          echo "::add-mask::$dsn"
          echo "POSTGRES_TEST_URL=$dsn" >> "$GITHUB_ENV"

      # รันบนกิ่งใช้แล้วทิ้งเท่านั้น ไม่ใช่ Neon ที่แชร์ — ทำให้ PR ที่เพิ่ม
      # migration ใหม่ถูกพิสูจน์ว่ารันผ่านบน schema จริงก่อนเข้า dev
      - name: Apply migrations to the branch
        run: DATABASE_URL_UNPOOLED="$POSTGRES_TEST_URL" uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -q

      - name: Delete ephemeral Neon branch
        if: always() && steps.neon_branch.outputs.branch != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          # ลบไม่สำเร็จไม่ควรทำให้ run แดงและกลบสาเหตุจริงที่อยู่ก่อนหน้า
          # --expires-at ตอนสร้างเป็นตาข่ายรับไว้อยู่แล้ว
          npx -y neonctl branches delete "${{ steps.neon_branch.outputs.branch }}" \
            --project-id "${{ vars.NEON_PROJECT_ID }}" \
            || echo "::warning::could not delete the branch; it expires on its own"