<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GReader wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#24231f;--mid:#6f6c66;--soft:#8d8a83;--line:#c7c4be;--hair:#e2dfda;--fill:#eceae6;--pap:#fff;--acc:#b68235;--acc-d:#7d5a23;--canvas:#d9d7d2;--side:268px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font:13px/1.45 "Helvetica Neue",Helvetica,Arial,"Noto Sans Thai",sans-serif;display:grid;grid-template-rows:52px 1fr;grid-template-columns:var(--side) 1fr;grid-template-areas:"top top" "side main";overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--pap);border-bottom:1px solid var(--line)}
.brand{font:700 14px/1 "Space Mono",monospace;letter-spacing:.03em;white-space:nowrap;cursor:pointer;background:none;border:0;padding:4px 0}
.brand span{color:var(--soft);font-weight:400}
.chips{display:flex;gap:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--mid)}
.chip:hover{border-color:var(--acc)}
.chip.on{border-color:var(--acc);color:var(--acc-d);background:#fbf6ee}
.sp{flex:1}
.search{border:1px solid var(--line);border-radius:4px;height:30px;padding:0 10px;width:200px;font:inherit;background:#fff}
.tog{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tog button{border:0;background:#fff;padding:5px 12px;font-size:12px;color:var(--mid);border-right:1px solid var(--line)}
.tog button:last-child{border-right:0}
.tog button.on{background:var(--fill);color:var(--ink)}
.side{grid-area:side;background:var(--pap);border-right:1px solid var(--line);overflow:auto;padding:8px 0 24px}
.grp{font:11px/1 "Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:16px 16px 6px;display:flex;justify-content:space-between}
.it{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 16px 6px 13px;border-left:3px solid transparent}
.it:hover{background:var(--fill)}
.it.on{border-left-color:var(--acc);background:#fbf6ee}
.it .c{font:11px/1.2 "Space Mono",monospace;color:var(--acc-d);margin-right:6px}
.it .t{color:var(--ink)}
.it .k{display:block;font-size:11px;color:var(--soft);margin-top:1px}
.it.sub{padding-left:26px}
.main{grid-area:main;overflow:auto;position:relative}
/* screen view */
.sh{position:sticky;top:0;z-index:2;background:rgba(236,234,230,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:16px;align-items:flex-start}
.sh .meta{flex:1;min-width:0}
.sh h1{margin:0;font-size:17px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sh h1 .c{font:13px "Space Mono",monospace;color:var(--acc-d)}
.pill{font:11px/1 "Space Mono",monospace;border:1px solid var(--line);background:#fff;border-radius:3px;padding:4px 7px;color:var(--mid);font-weight:400}
.role{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;font-weight:400}
.note{margin:6px 0 0;font-family:"Noto Sans Thai",sans-serif;color:var(--mid);font-size:13px}
.nav{display:flex;gap:6px;align-items:center;flex:none}
.nb{border:1px solid var(--line);background:#fff;border-radius:4px;padding:6px 11px;font-size:12px}
.nb:hover{border-color:var(--acc)}
.nb:disabled{opacity:.4;cursor:default}
.cnt{font:11px "Space Mono",monospace;color:var(--soft);min-width:52px;text-align:center}
.stage{padding:32px 24px 64px;display:flex;justify-content:center}
.fw{position:relative;flex:none;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.fw iframe{border:0;display:block;transform-origin:0 0;background:#fff}
.hint{position:fixed;right:16px;bottom:14px;font-size:11px;color:var(--mid);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:4px;padding:6px 10px;pointer-events:none}
.hint b{font-family:"Space Mono",monospace;font-weight:400;border:1px solid var(--line);border-radius:3px;padding:0 4px;background:#fff}
/* overview */
.ov{padding:24px 28px 64px}
.ov h2{font:12px/1 "Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin:18px 0 14px;display:flex;gap:10px;align-items:center}
.ov h2 span{color:var(--soft)}
.ov h2::after{content:"";flex:1;height:1px;background:var(--line)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-bottom:24px}
.tc{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px}
.tb{background:#fff;border:1px solid var(--line);height:170px;overflow:hidden;position:relative;display:flex;align-items:flex-start;justify-content:center}
.tc:hover .tb{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tb iframe{border:0;transform-origin:0 0;pointer-events:none;position:absolute;top:0}
.tl{font-size:12px}
.tl .c{font:11px "Space Mono",monospace;color:var(--acc-d);margin-right:6px}
.tl .k{display:block;color:var(--soft);font-size:11px}
.empty{padding:40px;color:var(--mid)}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-areas:"top" "main"}.side,.search,.chips,.hint,.brand span{display:none}.sh{flex-direction:column;gap:8px;padding:10px 16px}.sh h1{font-size:15px}.stage{padding:16px 16px 48px}.tog button{padding:5px 8px}.ov{padding:16px}}
</style></head>
<body>
<header class="top">
  <button class="brand" id="home" title="All screens">GREADER <span>· wireframes</span></button>
  <div class="chips" id="chips"></div>
  <div class="sp"></div>
  <input class="search" id="q" placeholder="Search screens…  ( / )">
  <div class="tog"><button id="vOv">All screens</button><button id="vSc">Prototype</button></div>
</header>
<nav class="side" id="side"></nav>
<main class="main" id="main"></main>

    h+=`<h2>${ROLE_TH[r]} <span>${g.length}</span></h2><div class="tg">`+g.map(s=>`<button class="tc" data-s="${s.slug}"><div class="tb" data-id="${s.id}"></div><div class="tl"><span class="c">${esc(s.code)}</span>${esc(s.title)}${sub(s)?`<span class="k">${esc(sub(s))}</span>`:''}</div></button>`).join('')+'</div>'}
  $('main').innerHTML=h+(v.length?'':'<div class="empty">No screens match.</div>')+'</div>';
  $('main').querySelectorAll('.tc').forEach(b=>b.onclick=()=>go(b.dataset.s));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const s=byId[e.target.dataset.id];
    const f=document.createElement('iframe');const bw=e.target.clientWidth,k=Math.min(bw/s.w,170/s.h);f.width=s.w;f.height=s.h;f.style.transform=`scale(${k})`;f.style.left=(bw-s.w*k)/2+'px';f.style.top=Math.max(0,(170-s.h*k)/2)+'px';f.tabIndex=-1;f.srcdoc=s.doc;e.target.appendChild(f)}),{root:$('main'),rootMargin:'300px'});
  $('main').querySelectorAll('.tb').forEach(t=>io.observe(t));
  $('main').scrollTop=0;side();document.title='GReader wireframes'}
function route(){const slug=decodeURIComponent(location.hash.replace(/^#\/?/,''));const s=bySlug[slug];
  $('vOv').classList.toggle('on',!s);$('vSc').classList.toggle('on',!!s);s?screen(s):overview()}
function renderAll(){chips();cur?screen(cur):overview()}
$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();cur?side():overview()};
$('home').onclick=$('vOv').onclick=()=>go('');
$('vSc').onclick=()=>go((cur||visible()[0]||S[0]).slug);
addEventListener('hashchange',route);addEventListener('resize',size);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(e.key==='/'){e.preventDefault();$('q').focus()}
  else if(e.key==='Escape')go('');
  else if(cur&&e.key==='ArrowRight')$('nx').click();
  else if(cur&&e.key==='ArrowLeft')$('pv').click();
  else if(cur&&(e.key==='f'||e.key==='F'))$('fit').click();
  else if(!cur&&e.key==='ArrowRight'){const v=visible();v[0]&&go(v[0].slug)}});
chips();route();
</script>
