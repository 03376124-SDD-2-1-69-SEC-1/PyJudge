<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GReader team scaffold">
  <title>{% block title %}GReader{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-50 text-slate-950">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <a class="font-semibold tracking-tight" href="/">GReader</a>
      <nav aria-label="Primary navigation">
        <a class="text-sm font-medium text-blue-700 hover:text-blue-900" href="/docs">API Docs</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-6 py-12">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
