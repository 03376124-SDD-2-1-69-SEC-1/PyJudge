<header>
  <h1 class="text-2xl font-bold">{{ view.classroom.course_name }} · Sec {{ view.classroom.section }}</h1>
  <p>{{ view.instructor_name }} · semester {{ view.classroom.semester }}</p>
</header>
<nav aria-label="Classroom tabs">
  {% for value, label in [("problems", "Problems"), ("summary", "Summary")] %}
  <a href="/classes/{{ view.classroom.id }}?tab={{ value }}" {% if tab == value %}aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
